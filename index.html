<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Biblioteca de livros de Front-end — CP 06 FIAP" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Biblioteca Front-end</title>
    <script>
      // Aplica o tema antes do React carregar, evitando "flash" de tema errado
      try {
        const salvo = localStorage.getItem('tema')
        const prefereEscuro = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (salvo === 'escuro' || (!salvo && prefereEscuro)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
